
[window]
startup_mode = "Fullscreen"

[terminal.shell]
program = "/bin/bash"
args = ["-l", "-c", "tmux attach"]

[font]
size = 11

[font.bold]
family = "RobotoMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "RobotoMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "RobotoMono Nerd Font"
style = "Italic"

[font.normal]
family = "RobotoMono Nerd Font"
style = "Regular"

[general]
live_config_reload = true

[terminal]

[env]
WINIT_X11_SCALE_FACTOR = "1.05"
